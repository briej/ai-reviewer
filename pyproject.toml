[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-reviewer"
version = "1.2.0"
description = "AI-powered code reviewer with OWASP Top 10 checks"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "briej", email = "rikutoyoshimura3@gmail.com"}
]
keywords = ["code-review", "security", "owasp", "static-analysis", "cli", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "jinja2>=3.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
ai-review = "ai_reviewer:main"

[project.urls]
Homepage = "https://github.com/briej/ai-reviewer"
Repository = "https://github.com/briej/ai-reviewer"
Issues = "https://github.com/briej/ai-reviewer/issues"

[tool.setuptools]
py-modules = ["ai_reviewer"]
packages = ["src"]

[tool.setuptools.package-data]
src = ["config/rules.json", "config/settings.json"]
