[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-reviewer-cli"
version = "1.4.0"
description = "AI-powered code reviewer with OWASP Top 10 checks and context awareness"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "briej"}
]
keywords = ["code-review", "security", "owasp", "ai", "static-analysis", "context-aware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.2",
    "pygments>=2.16.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "jinja2>=3.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.1.0",
]

[project.scripts]
ai-review = "ai_reviewer:main"
ai-reviewer = "ai_reviewer:main"

[project.urls]
Homepage = "https://github.com/briej/ai-reviewer"
Repository = "https://github.com/briej/ai-reviewer"
Issues = "https://github.com/briej/ai-reviewer/issues"

[tool.setuptools]
py-modules = ["ai_reviewer"]
packages = ["src"]

[tool.setuptools.package-data]
src = ["config/rules.json", "config/settings.json"]

[tool.ruff]
line-length = 88
target-version = "py312"
select = ["E", "F", "W", "C90", "S"]
exclude = ["build", "dist", ".venv", ".git", "ai-reviewer.egg-info"]
extend-ignore = ["W291", "W292", "W293", "C901"]
per-file-ignores = {"tests/*" = ["S101"], "test_*.py" = ["S101"], "web_app.py" = ["S104"]}
