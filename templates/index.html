<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ai-reviewer - Web Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #e94560;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            color: #4ecca3;
            margin-bottom: 40px;
            font-size: 1.2em;
        }
        .card {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #4ecca3;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background: #0f0f1a;
            border: 1px solid #4ecca3;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 1em;
        }
        button {
            background: #e94560;
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: background 0.3s;
        }
        button:hover {
            background: #d63850;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .results {
            display: none;
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .summary-card {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .summary-card.critical {
            border-left: 4px solid #e94560;
        }
        .summary-card.warning {
            border-left: 4px solid #f4a261;
        }
        .summary-card.info {
            border-left: 4px solid #2a9d8f;
        }
        .summary-card .number {
            font-size: 2.5em;
            font-weight: bold;
        }
        .summary-card.critical .number {
            color: #e94560;
        }
        .summary-card.warning .number {
            color: #f4a261;
        }
        .summary-card.info .number {
            color: #2a9d8f;
        }
        .issues-list {
            margin-top: 30px;
        }
        .issue {
            background: #1a1a2e;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 4px solid;
        }
        .issue.critical {
            border-left-color: #e94560;
        }
        .issue.warning {
            border-left-color: #f4a261;
        }
        .issue.info {
            border-left-color: #2a9d8f;
        }
        .issue-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .issue-type {
            color: #4ecca3;
            font-weight: 600;
        }
        .issue-location {
            color: #888;
            font-family: 'Fira Code', monospace;
            font-size: 0.9em;
        }
        .issue-message {
            color: #e0e0e0;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #4ecca3;
        }
        .error {
            background: #3a1010;
            color: #e94560;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 ai-reviewer</h1>
        <p class="subtitle">AI-Powered Code Reviewer - Web Interface</p>

        <div class="card">
            <h2 style="margin-bottom: 20px;">Scan Project</h2>
            <form id="scanForm">
                <div class="form-group">
                    <label for="path">Project Path</label>
                    <input type="text" id="path" name="path" placeholder="/path/to/project" required>
                </div>
                <div class="form-group">
                    <label for="mode">Mode</label>
                    <select id="mode" name="mode">
                        <option value="fast">Fast (Rule-based)</option>
                        <option value="ai">AI (Ollama)</option>
                        <option value="cloud">Cloud (API)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="provider">Provider</label>
                    <select id="provider" name="provider">
                        <option value="ollama">Ollama</option>
                        <option value="deepseek">DeepSeek</option>
                        <option value="openrouter">OpenRouter</option>
                        <option value="groq">Groq</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="model">Model</label>
                    <input type="text" id="model" name="model" value="llama3.1:8b" placeholder="llama3.1:8b">
                </div>
                <button type="submit" id="scanBtn">
                    🔍 Start Scan
                </button>
            </form>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <p>⏳ Scanning project... This may take a few minutes.</p>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="results" class="results">
            <h2 style="margin-bottom: 20px;">Scan Results</h2>
            <div class="summary">
                <div class="summary-card critical">
                    <div class="number" id="criticalCount">0</div>
                    <div>Critical</div>
                </div>
                <div class="summary-card warning">
                    <div class="number" id="warningCount">0</div>
                    <div>Warning</div>
                </div>
                <div class="summary-card info">
                    <div class="number" id="infoCount">0</div>
                    <div>Info</div>
                </div>
            </div>
            <div class="issues-list" id="issuesList"></div>
        </div>
    </div>

    <script>
        document.getElementById('scanForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const scanBtn = document.getElementById('scanBtn');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const error = document.getElementById('error');
            
            scanBtn.disabled = true;
            loading.style.display = 'block';
            results.style.display = 'none';
            error.style.display = 'none';
            
            const formData = new FormData(e.target);
            
            try {
                const response = await fetch('/api/scan', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                // Get full results
                const resultsResponse = await fetch(`/api/results/${data.scan_id}`);
                const fullResults = await resultsResponse.json();
                
                // Display summary
                document.getElementById('criticalCount').textContent = fullResults.summary.critical;
                document.getElementById('warningCount').textContent = fullResults.summary.warning;
                document.getElementById('infoCount').textContent = fullResults.summary.info;
                
                // Display issues
                const issuesList = document.getElementById('issuesList');
                issuesList.innerHTML = '';
                
                fullResults.issues.forEach(issue => {
                    const issueDiv = document.createElement('div');
                    issueDiv.className = `issue ${issue.severity}`;
                    issueDiv.innerHTML = `
                        <div class="issue-header">
                            <span class="issue-type">${issue.type}</span>
                            <span class="issue-location">${issue.location}</span>
                        </div>
                        <div class="issue-message">${issue.message}</div>
                    `;
                    issuesList.appendChild(issueDiv);
                });
                
                results.style.display = 'block';
            } catch (err) {
                error.textContent = `❌ Error: ${err.message}`;
                error.style.display = 'block';
            } finally {
                scanBtn.disabled = false;
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
